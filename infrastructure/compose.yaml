name: omniagent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 192m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY requerido}
      N8N_API_KEY: ${N8N_API_KEY:?N8N_API_KEY requerido}
      N8N_HOST: n8n.omniagent.jaimeberrios.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.omniagent.jaimeberrios.com/
      WEBHOOK_URL: https://n8n.omniagent.jaimeberrios.com/
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: America/El_Salvador
      TZ: America/El_Salvador
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - web_network
    mem_limit: 1g

  api:
    image: omniagent-backend:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:?Token requerido}
      MESSENGER_VERIFY_TOKEN: ${MESSENGER_VERIFY_TOKEN:?Token requerido}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?META_VERIFY_TOKEN requerido}
      META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET requerido}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?META_ACCESS_TOKEN requerido}
      WHATSAPP_TENANT_ID: ${WHATSAPP_TENANT_ID:?WHATSAPP_TENANT_ID requerido}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?WHATSAPP_PHONE_NUMBER_ID requerido}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requerido}
      N8N_API_KEY: ${N8N_API_KEY:?N8N_API_KEY requerido}
      N8N_TENANT_ID: ${N8N_TENANT_ID:?N8N_TENANT_ID requerido}
      N8N_ADMIN_API_KEY: ${N8N_ADMIN_API_KEY:?N8N_ADMIN_API_KEY requerido}
      N8N_CONTROL_API_KEY: ${N8N_CONTROL_API_KEY:?N8N_CONTROL_API_KEY requerido}
      N8N_BASE_URL: http://n8n:5678
      N8N_WORKFLOW_ID: ${N8N_WORKFLOW_ID:?N8N_WORKFLOW_ID requerido}
      N8N_WORKFLOW_TENANT_ID: ${N8N_WORKFLOW_TENANT_ID:?N8N_WORKFLOW_TENANT_ID requerido}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web_network
    mem_limit: 128m


  whatsapp-worker:
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
    entrypoint: ["python", "-m", "app.whatsapp_worker"]
    command: ["python", "-m", "app.whatsapp_worker"]
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY:?Webhook key requerido}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/omniagent-mensajes
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WHATSAPP_TENANT_ID: ${WHATSAPP_TENANT_ID:?WHATSAPP_TENANT_ID requerido}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?WHATSAPP_PHONE_NUMBER_ID requerido}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      n8n:
        condition: service_started
    networks:
      - internal
      - web_network
    mem_limit: 128m



  website-worker:
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
    profiles: [website]
    entrypoint: ["python", "-m", "app.website_worker"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEBSITE_WORKER_ENABLED: ${WEBSITE_WORKER_ENABLED:-false}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/omniagent-website
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
      api:
        condition: service_started
    networks: [internal, web_network]
    mem_limit: 128m

  messenger-worker:
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
    entrypoint: ["python", "-m", "app.messenger_worker"]
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:?Token de Messenger requerido}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY:?Webhook key requerido}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/omniagent-messenger
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web_network
    mem_limit: 128m


  messenger-outbound-worker:
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
    entrypoint: ["python", "-m", "app.messenger_outbound_worker"]
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:?Token de Messenger requerido}
      MESSENGER_OUTBOUND_ENABLED: ${MESSENGER_OUTBOUND_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web_network
    mem_limit: 128m

  whatsapp-outbound-worker:
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
    entrypoint: ["python", "-m", "app.whatsapp_outbound_worker"]
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?META_ACCESS_TOKEN requerido}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WHATSAPP_TENANT_ID: ${WHATSAPP_TENANT_ID:?WHATSAPP_TENANT_ID requerido}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?WHATSAPP_PHONE_NUMBER_ID requerido}
      WHATSAPP_OUTBOUND_ENABLED: ${WHATSAPP_OUTBOUND_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web_network
    mem_limit: 128m

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    networks:
      - web_network
    mem_limit: 48m

networks:
  internal:
    driver: bridge
    internal: true

  web_network:
    external: true
    name: web_network

volumes:
  postgres_data:
  n8n_data:
