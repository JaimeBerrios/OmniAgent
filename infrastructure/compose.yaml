
name: omniagent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_API_KEY: ${N8N_API_KEY:?N8N_API_KEY no configurada}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/El_Salvador
      TZ: America/El_Salvador
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY no configurada}
      N8N_API_KEY: ${N8N_API_KEY:?N8N_API_KEY no configurada}
      N8N_TENANT_ID: ${N8N_TENANT_ID:?N8N_TENANT_ID no configurado}
      N8N_ADMIN_API_KEY: ${N8N_ADMIN_API_KEY:?N8N_ADMIN_API_KEY no configurada}
      N8N_BASE_URL: http://n8n:5678
      N8N_WORKFLOW_ID: ${N8N_WORKFLOW_ID:?N8N_WORKFLOW_ID no configurado}
      N8N_WORKFLOW_TENANT_ID: ${N8N_WORKFLOW_TENANT_ID:?N8N_WORKFLOW_TENANT_ID no configurado}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24

volumes:
  postgres_data:
  n8n_data:
