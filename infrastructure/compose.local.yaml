services:
  messenger-outbound-worker:
    environment:
      MESSENGER_OUTBOUND_ENABLED: "true"
  api:
    ports:
    - 127.0.0.1:8000:8000
    image: omniagent-backend:${APP_VERSION:-dev}
    pull_policy: never
  n8n:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
    - 127.0.0.1:5678:5678
    environment:
      N8N_HOST: omniagent-n8n.jaimeberrios.com
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://omniagent-n8n.jaimeberrios.com/
      WEBHOOK_URL: https://omniagent-n8n.jaimeberrios.com/
      N8N_WEBHOOK_URL: https://omniagent-n8n.jaimeberrios.com/
      N8N_SECURE_COOKIE: 'true'
  frontend:
    ports:
    - 127.0.0.1:8080:80
networks:
  web_network:
    external: false
    name: web_network
    driver: bridge
